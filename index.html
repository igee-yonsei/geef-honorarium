<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEEF 2027 Honorarium Documents</title>
<meta name="robots" content="noindex">
<style>
  /* No external fonts or scripts: the page must open in every country, including mainland China. */
  :root{
    --ink:#1C3150; --text:#24313F; --muted:#5B6B7B; --rule:#DCE2E8;
    --tint:#EEF3F8; --ok:#3F7E44; --warn:#A21942; --focus:#0A97D9;
  }
  *{box-sizing:border-box}
  html{font-size:17px}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI","Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.6}
  .sdg{display:grid;grid-template-columns:repeat(17,1fr);height:8px}
  .sdg span:nth-child(1){background:#E5243B}.sdg span:nth-child(2){background:#DDA63A}.sdg span:nth-child(3){background:#4C9F38}
  .sdg span:nth-child(4){background:#C5192D}.sdg span:nth-child(5){background:#FF3A21}.sdg span:nth-child(6){background:#26BDE2}
  .sdg span:nth-child(7){background:#FCC30B}.sdg span:nth-child(8){background:#A21942}.sdg span:nth-child(9){background:#FD6925}
  .sdg span:nth-child(10){background:#DD1367}.sdg span:nth-child(11){background:#FD9D24}.sdg span:nth-child(12){background:#BF8B2E}
  .sdg span:nth-child(13){background:#3F7E44}.sdg span:nth-child(14){background:#0A97D9}.sdg span:nth-child(15){background:#56C02B}
  .sdg span:nth-child(16){background:#00689D}.sdg span:nth-child(17){background:#19486A}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px}
  header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding-top:18px;padding-bottom:18px}
  .logos{display:flex;align-items:center;gap:18px;min-height:40px}
  .logos img{height:40px;width:auto}
  .logos .fallback{font-weight:700;color:var(--ink);font-size:.95rem}
  .lang{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .lang button{border:0;background:#fff;color:var(--muted);padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
  a{color:#00689D}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  h1{color:var(--ink);font-size:2.1rem;line-height:1.2;margin:28px 0 10px;font-weight:700;letter-spacing:-.01em}
  .lede{font-size:1.05rem;color:var(--muted);margin:0 0 8px;max-width:62ch}
  .event{color:var(--ink);font-weight:600;margin:0 0 34px}
  section.step{display:grid;grid-template-columns:44px 1fr;gap:0 14px;padding:26px 0;border-top:1px solid var(--rule)}
  section.step[hidden]{display:none}
  .num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem;margin-top:2px}
  h2{margin:0 0 6px;color:var(--ink);font-size:1.3rem;line-height:1.3}
  .hint{color:var(--muted);margin:0 0 16px;font-size:.95rem}
  .q{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px dashed var(--rule)}
  .q:last-child{border-bottom:0}
  .q p{margin:0;font-size:.97rem}
  .yn{display:flex;gap:6px;flex-shrink:0}
  .yn label{position:relative}
  .yn input{position:absolute;opacity:0;width:1px;height:1px}
  .yn span{display:inline-block;min-width:58px;text-align:center;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;font-size:.9rem;color:var(--muted)}
  .yn input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
  .yn input:focus-visible+span, select:focus-visible, button:focus-visible, a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  select{width:100%;max-width:420px;font:inherit;padding:10px 12px;border:1px solid #AEB9C5;border-radius:6px;background:#fff;color:var(--text)}
  .result{background:var(--tint);border-left:5px solid var(--ink);padding:16px 18px;margin:4px 0 0;border-radius:0 6px 6px 0}
  .result.warn{border-left-color:var(--warn)}
  .result.ok{border-left-color:var(--ok)}
  .result h3{margin:0 0 6px;font-size:1.08rem;color:var(--ink)}
  .result p{margin:0 0 8px}
  .docs{margin:14px 0 0;padding:0;list-style:none}
  .docs li{padding:10px 0 10px 30px;position:relative;border-top:1px solid var(--rule)}
  .docs li:first-child{border-top:0}
  .docs li::before{content:"";position:absolute;left:4px;top:16px;width:12px;height:12px;border:2px solid var(--ink);border-radius:3px}
  .docs strong{color:var(--ink)}
  .dl{display:inline-block;margin-top:8px;background:var(--ink);color:#fff;text-decoration:none;padding:9px 16px;border-radius:6px;font-weight:600;font-size:.95rem}
  .dl:hover{background:#0F2340}
  .small{font-size:.88rem;color:var(--muted)}
  .send dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
  .send dt{color:var(--muted)}
  .send dd{margin:0;font-weight:600;color:var(--ink);word-break:break-word}
  .note{margin-top:14px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;font-size:.93rem}
  footer{border-top:1px solid var(--rule);margin-top:10px;padding:22px 0 40px;color:var(--muted);font-size:.85rem}
  footer p{margin:0 0 6px}
  .error{color:var(--warn)}
  @media (max-width:560px){
    html{font-size:16px}
    h1{font-size:1.7rem}
    section.step{grid-template-columns:1fr}
    .num{margin-bottom:8px}
    .q{flex-direction:column;align-items:flex-start;gap:6px}
    .send dl{grid-template-columns:1fr}
    .send dd{margin-bottom:6px}
  }
</style>
</head>

<div class="sdg" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

<header>
  <div class="wrap">
    <div class="logos">
      <img src="assets/igee-logo.png" alt="Yonsei Institute for Global Engagement & Empowerment" onerror="this.remove()">

    </div>

      <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
    </div>
  </div>

<main class="wrap">
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <p class="event" id="eventLine"></p>

  <section class="step" id="step1" aria-labelledby="h1s">
    <div class="num" aria-hidden="true">1</div>
    <div>
      <h2 id="h1s" data-t="s1title"></h2>
      <p class="hint" data-t="s1hint"></p>
      <div id="questions"></div>
    </div>
  </section>

  <section class="step" id="step2" hidden aria-labelledby="h2s">
    <div class="num" aria-hidden="true">2</div>
    <div>
      <h2 id="h2s" data-t="s2title"></h2>
      <p class="hint" data-t="s2hint"></p>
      <label for="country" class="small" data-t="s2label"></label><br>
      <select id="country"><option value="" data-t="s2placeholder"></option></select>
      <p id="loadError" class="error small" hidden></p>
    </div>
  </section>

  <section class="step" id="step3" hidden aria-labelledby="h3s" aria-live="polite">
    <div class="num" aria-hidden="true" id="num3">3</div>
    <div>
      <h2 id="h3s" data-t="s3title"></h2>
      <div id="result"></div>
    </div>
  </section>

  <section class="step send" id="step4" hidden aria-labelledby="h4s">
    <div class="num" aria-hidden="true" id="num4">4</div>
    <div>
      <h2 id="h4s" data-t="s4title"></h2>
      <dl id="sendList"></dl>
      <div class="note" data-t="s4note"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-t="foot1"></p>
    <p data-t="foot2"></p>
    <p id="contactLine"></p>
  </div>
</footer>

let lang = "en", countries = [], answers = [null,null,null,null,null], chosen = "";

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fill(s){ return s.replaceAll("{Y}", CONFIG.certYear).replaceAll("{P}", String(+CONFIG.certYear-1)).replaceAll("{F}", CONFIG.finalDeadline[lang]); }

function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift();
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||""])));
}

async function loadCountries(){
  try{
    const res = await fetch(CONFIG.countriesCsv, {cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    countries = parseCSV(await res.text()).map(r=>({ko:r["국가"], en:r["영문명"], iso:r["ISO"], code:r["분류코드"]}));
    renderSelect();
  }catch(e){ const el=$("#loadError"); el.textContent=T[lang].loadError; el.hidden=false; }
}

function renderQuestions(){
  const t=T[lang];
  $("#questions").innerHTML = t.q.map((q,i)=>`
    <div class="q" role="radiogroup" aria-label="${esc(q)}">
      <p>${esc(q)}</p>
      <div class="yn">
        <label><input type="radio" name="q${i}" value="yes" ${answers[i]==="yes"?"checked":""}><span>${t.yes}</span></label>
        <label><input type="radio" name="q${i}" value="no" ${answers[i]==="no"?"checked":""}><span>${t.no}</span></label>
      </div>
    </div>`).join("");
  document.querySelectorAll("#questions input").forEach(inp=>inp.addEventListener("change", e=>{
    answers[+e.target.name.slice(1)] = e.target.value; update();
  }));
}

function renderSelect(){
  const t=T[lang], sel=$("#country");
  const list=[...countries].sort((a,b)=>a[lang].localeCompare(b[lang], lang));
  sel.innerHTML = `<option value="">${esc(t.s2placeholder)}</option>` +
    list.map(c=>`<option value="${esc(c.iso)}" ${c.iso===chosen?"selected":""}>${esc(c[lang])}</option>`).join("") +
    `<option value="__none" ${chosen==="__none"?"selected":""}>${esc(t.notListed)}</option>`;
}

function resultKey(){
  if(answers.includes("yes")) return "resident";
  if(answers.includes(null) || !chosen) return null;
  if(chosen==="__none") return "none";
  const c=countries.find(x=>x.iso===chosen);
  if(!c) return null;
  if(c.code==="N") return "none";
  if(c.code==="B"||c.code==="X") return "check";
  return "treaty";
}

function update(){
  const t=T[lang], resident=answers.includes("yes"), allAnswered=!answers.includes(null);
  $("#step2").hidden = resident || !allAnswered;
  const key=resultKey();
  $("#step3").hidden = $("#step4").hidden = !key;
  $("#num3").textContent = resident ? "2" : "3";
  $("#num4").textContent = resident ? "3" : "4";
  if(!key) return;
  const r=t.res[key];
  let html = `<div class="result ${r.cls}"><h3>${esc(r.h)}</h3><p>${esc(r.p)}</p></div><ul class="docs">` +
    r.docs.map(d=>`<li><strong>${esc(fill(d[0]))}</strong><br><span class="small">${esc(fill(d[1]))}</span></li>`).join("") + `</ul>`;
  const link = CERT_LINKS[chosen];
  if((key==="treaty"||key==="check") && link)
    html += `<p class="small">${esc(t.certExample)}<a href="${link[1]}" target="_blank" rel="noopener">${esc(link[0])}</a></p>`;
  html += `<a class="dl" href="${CONFIG.forms[r.form]}" download>${esc(r.btn)}</a>`;
  if(r.after) html += `<p class="small" style="margin-top:14px">${esc(fill(r.after))}</p>`;
  $("#result").innerHTML = html;
  const rows=[[t.sendTo, CONFIG.email],[t.subject, CONFIG.subject],[t.formBy, CONFIG.formDeadline[lang]]];
  if(key==="treaty"||key==="check") rows.push([t.certBy, CONFIG.certDeadline[lang]]);
  $("#sendList").innerHTML = rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("");
}

function setLang(l){
  lang=l; document.documentElement.lang=l;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===l));
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=T[l][el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  $("#eventLine").textContent = CONFIG.event[l];
  $("#contactLine").textContent = T[l].contact + CONFIG.email;
  if(!$("#loadError").hidden) $("#loadError").textContent=T[l].loadError;
  renderQuestions(); if(countries.length) renderSelect(); update();
}

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click", ()=>setLang(b.dataset.lang)));
$("#country").addEventListener("change", e=>{ chosen=e.target.value; update(); });
setLang(navigator.language && navigator.language.startsWith("ko") ? "ko" : "en");
loadCountries();
</script>
</body>
</html>
